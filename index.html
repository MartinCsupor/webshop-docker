<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Webshop</title>
</head>
<body>
    <main class="container py-4">
        <h1 class="h2 mb-3 fw-bold">Felhasználók</h1>

        <form id="userForm" method="post" class="my-5">
            <div class="mb-3">
                <label for="nameInput" class="form-label">Név</label>
                <input type="text" class="form-control" id="nameInput" required>
            </div>
            <div class="mb-3">
                <label for="emailInput" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="emailInput" aria-describedby="emailHelp" required>
            </div>
            <div class="mb-3">
                <label for="cityInput" class="form-label">Város</label>
                <input type="text" class="form-control" id="cityInput" required>
            </div>
            <div class="mb-3">
                <label for="phoneInput" class="form-label">Telefon</label>
                <input type="tel" class="form-control" id="phoneInput" autocomplete="tel" required>
            </div>
            <button type="submit" class="btn btn-primary">Mentés</button>
        </form>

        <div class="table-responsive">
            <table class="table table-striped table-hover users-table mb-0">
                <thead>
                    <tr>
                        <th>Név</th>
                        <th>E-mail</th>
                        <th>Város</th>
                        <th>Telefon</th>
                        <th>Szerepkör</th>
                        <th>Műveletek</th>
                    </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
