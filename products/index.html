<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Termékek</title>
</head>

<body>
    <main class="container py-4">
        <h1 class="h2 mb-3 fw-bold">Termékek</h1>

        <form id="productForm" action="POST">
            <form id="productForm">
                <div class="mb-3">
                    <label class="form-label">Termék neve</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Kép URL</label>
                    <input type="url" class="form-control" id="image" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ár (Ft)</label>
                    <input type="number" class="form-control" id="price" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Készlet (db)</label>
                    <input type="number" class="form-control" id="stock" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Értékelés</label>
                    <input type="number" class="form-control" id="rating" min="0" max="5" step="0.1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Gyártó neve</label>
                    <input type="text" class="form-control" id="manufacturerName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Gyártó országa</label>
                    <input type="text" class="form-control" id="manufacturerCountry" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tulajdonságok (vesszővel elválasztva)</label>
                    <textarea class="form-control" id="features" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    Termék hozzáadása
                </button>
            </form>

            <div class="my-5">
                <h5 class="mb-3">Termék keresése ID alapján</h5>
                <div class="input-group" style="max-width: 400px;">
                    <input type="number" id="productId" class="form-control">
                    <button id="productIdFind" class="btn btn-primary">Keresés</button>
                </div>
                <p id="showAll" class="text-primary fw-semibold mt-2 mb-0">Összes mutatása</p>
            </div>

            <div class="my-5">
                <h5 class="mb-3">Termék törlése ID alapján</h5>
                <div class="input-group" style="max-width: 400px;">
                    <input type="number" id="deleteProductId" class="form-control">
                    <button id="productIdDelete" class="btn btn-danger">Törlés</button>
                </div>
            </div>

            <div id="productsContainer" class="container mt-4 d-flex flex-wrap">

            </div>

    </main>
    <script src="index.js"></script>
</body>

</html>
